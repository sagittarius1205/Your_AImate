  // the button, so noticing does not depend on opening anything. `?` and not `0` when the fleet
  // command failed, because "nothing is waiting" and "I could not look" must not look the same.
  gateNEl.textContent = fleetErr ? "?" : String(waiting);
  gateEl.classList.toggle("wait", !fleetErr && waiting > 0);

  drawRows();
}

// While the pointer is down on the list the rows are left as they are, and drawn again a moment after
// it comes up. Every poll replaces every row, and a pin is a button in one of them: a poll that lands
// between the press and the release removes the button the press began on, and the click goes with it.
// About a press in thirty would be lost to a poll every three seconds, which is a pin that sometimes
// does nothing. The wait after the release is what lets the click land on the button first, and a
// press that never reports its release is let go of after two seconds, because a list that stopped
// updating for ever would be worse than a click that was lost.
let rowsHeld = false, rowsOwed = false, rowsHeldAt = 0;
rowsEl.addEventListener("pointerdown", () => {
  rowsHeld = true;
  rowsHeldAt = Date.now();
});
for (const end of ["pointerup", "pointercancel"]) {
  window.addEventListener(end, () => {
    if (!rowsHeld) return;
    setTimeout(() => {
      rowsHeld = false;
      if (rowsOwed) drawRows();
    }, 80);
  });
}

// The rows in the order Rust sent them (`fleet::shown`): waiting, then pinned, then busy, then the
// rest, each newest first. The page does not sort them, and `pet_page` fails if it does.
//
// Built as DOM nodes with textContent, not as an HTML string. Session names, working directories
// and now the notification message are all external text, and two of the three can carry model
// output; textContent cannot be talked into being markup, whereas an escaper is one forgotten
// call away from being wrong.
function drawRows() {
  if (rowsHeld && Date.now() - rowsHeldAt < 2000) {
    rowsOwed = true;
    return;
  }
  rowsOwed = false;
  rowsEl.replaceChildren(
    ...sessions.map((s) => {
      const name = s.name || s.cwd.split("\\").pop() || s.sessionId.slice(0, 8);
      // Rust decides whether there is a line to show and how long it may be (fleet::asking_line).
      // The page only asks whether it got one.
      const asking = s.waiting ? s.waitingMessage : null;

      const row = el("div", "row" + (s.waiting ? " wait" : "") + (s.cwd === HERE ? " here" : ""));
      row.append(pinButton(s));
      row.append(relayButton(s));
      row.append(el("span", "st", s.waiting ? "waiting" : s.status));

      const mid = el("div", "mid");
      const nm = el("span", "nm", name);
      nm.title = asking || s.cwd;
      mid.append(nm);
      if (asking) mid.append(el("div", "ask", asking));
      row.append(mid);

      row.append(el("span", "ag", s.waiting && s.waitingSince ? age(s.waitingSince) : age(s.startedAt)));
      return row;
    }),
  );
}

function pinButton(s) {
  const b = el("button", "pin");
  b.type = "button";
  b.setAttribute("aria-pressed", String(s.pinned === true));
  b.title = s.pinned ? "取消釘選" : "釘在最上面";
  b.setAttribute("aria-label", b.title);
  b.addEventListener("click", () => pin(s.sessionId, !s.pinned));
  return b;
}

// A row's 轉話. It opens the relay sheet on that row with an empty field, and that is all: sending is
// the sheet's 送出. A row with no name gets a button that cannot be pressed, and says why.
function relayButton(s) {
  const b = el("button", "relay");
  b.type = "button";
  b.disabled = !s.name;
  b.title = s.name ? "轉話給這個 session" : "沒有名字的 session 轉不了";
  b.setAttribute("aria-label", b.title);
  b.addEventListener("click", () => {
    invoke("relay_open", { sessionId: s.sessionId }).catch((e) => {
      openErr = String(e);
      render();
    });
  });
  return b;
}

poll();
setInterval(poll, 3000);

// Report once, a couple of seconds in, so fps and the fleet hold real values by then. This is
// the only way a headless run reads the spike's answers.
setTimeout(async () => {
  // Sampled before the payload is built, because it needs real time to pass, and the report is
  // the only channel a headless run has to read any of this.
  const motion = await Character.sampleMotion(600);
  const mouth = await Character.sampleMouth(600);
  let shot = null;
  const png = Character.shot();
  if (png) {
    // The host writes the file; a WebView cannot. A picture that fails to save must not cost us
    // the rest of the report, so the outcome lands as a string either way.
    shot = await invoke("save_shot", { dataUrl: png }).catch((e) => "failed: " + String(e));
  }
  const r = charEl.getBoundingClientRect();
  invoke("report", {
    payload: {
      character: charStatus,
      drawn: Character.drawn(),
      logged,
      motion,
      mouth,
      shot,
      fps,
      devicePixelRatio: window.devicePixelRatio,
      canvasPx: [canvas.width, canvas.height],
      viewportCss: [window.innerWidth, window.innerHeight],
      hitRectCss: [r.left, r.top, r.width, r.height],
      // Rows actually in the DOM, and how many of them carry a line about what the session is
      // asking. The report fires on its own timer, so without these a render() that threw would
      // still produce a healthy-looking report: `sessions` is set before render runs.
      rows: rowsEl.children.length,
      rowsAsking: rowsEl.querySelectorAll(".ask").length,
      hitRectFrac: [
        +(r.left / window.innerWidth).toFixed(4),
        +(r.top / window.innerHeight).toFixed(4),
        +(r.width / window.innerWidth).toFixed(4),
        +(r.height / window.innerHeight).toFixed(4),
      ],
      chatSurface: Chat.surface(),
      // What the pet thinks of the core, so a probe outside the window can see it. Without this
      // the only way to know whether the core is up is to attach a debugger to the webview.
      coreState: coreState,
      // What the pet thinks of the speech input service, the button's state, and what the last
      // press came to, for the same reason as `coreState`.
      stt: { state: sttState, mic: micState, last: lastMic },
      // How the last turn sounded, part by part: voiced with its length, or silent with the reason
      // shown, and whether each part's words reached the bubble and its voice was scheduled.
      voice: lastVoice,
      // What became of her greeting: asked, voiced, silent, dropped, failed, or none to say.
      greeted,
      // What each part's plan held, as counts.
      plan: lastPlan,
      // The collapsed fleet list: what its button says, whether it is hinting, whether it is open.
      // The hint is the premise of the whole layout (Docs/DESIGN_Pet.md 4.4), so a headless run has
      // to be able to see it without a screenshot.
      gate: {
        waiting: gateNEl.textContent,
        hinting: gateEl.classList.contains("wait"),
        open: !panelEl.classList.contains("shut"),
      },
      panelFrac: panelRegions().map((g) => [g.x, g.y, g.w, g.h].map((v) => +v.toFixed(4))),
      fleetError: fleetErr,
      sessions: sessions.length,
      pinned: sessions.filter((s) => s.pinned).length,
      waiting: sessions.filter((s) => s.waiting).length,
      waitingIds: sessions.filter((s) => s.waiting).map((s) => s.sessionId),
      statuses: [...statuses],
      kinds: [...new Set(sessions.map((s) => s.kind))],
      userAgent: navigator.userAgent,
    },
  }).catch((e) => console.error(e));
}, 2500);

// ---------------------------------------------------------------- the relay

// Passing a message to another Claude session (Docs/DESIGN_Pet.md 6.2). Rust owns it
// (src-tauri/src/relay.rs): the draft, its revision, the target, the timers and the outcome. This
// draws the view it is sent and hands back what a click says: a row to open, the row picked and the
// field's text when 送出 is pressed, and a dismissal. No key, timer, transcript or core event
// approves, and `pet_page` fails if one starts to. Everything shown is set with textContent: the
// names are other sessions', the text is the model's or the user's, and a detail can be the core's.
let relayView = { state: "idle" };
// What the page keeps of one draft between views: the row picked, whether the list is open, the
// field, its count, and the line a refusal is said on. A redraw of the same draft keeps them, so a
// refusal that redraws the sheet does not lose what the user typed or what Rust said.
let relayDraft = null;
let relayTick = null;
const RELAY_WHY_NOT = {
  unnamed: "沒有名字，轉不了",
  sameTitle: "有同名的，分不出是哪一個",
  unsendable: "名字有換行或太長，轉不了",
};

function onRelayState(v) {
  if (!v || typeof v.state !== "string") {
    console.error("relay-state: " + JSON.stringify(v));
    return;
  }
  const opening = relayView.state === "idle" || (v.state === "drafting" && v.draft !== relayView.draft);
  const kept = v.state === "drafting" && relayView.state === "drafting" && v.revision === relayView.revision;
  relayView = v;
  relayEl.classList.toggle("shut", v.state === "idle");
  if (v.state !== "idle") {
    // The list has a z-index and the sheet has none, so the two never show at once, and a history
    // left open would lie over the sheet's lower half.
    panelEl.classList.add("shut");
    gateEl.classList.remove("open");
    if (opening && Chat.surface() === Chat.Surface.Log) Chat.setSurface(Chat.Surface.Bubble);
  }
  if (!kept) drawRelay(v, false);
  reportRegions();
}

function drawRelay(v, local) {
  clearInterval(relayTick);
  relayTick = null;
  if (v.state === "drafting") return drawDraft(v, local);
  relayDraft = null;
  if (v.state === "sending") return drawSending(v);
  if (v.state === "done") return drawDone(v);
  relayEl.replaceChildren();
}

function relayWhere(t) {
  return [t.cwd, t.status, typeof t.startedAt === "number" ? age(t.startedAt) : null].filter(Boolean).join(" · ");
}

function relayButtons(...buttons) {
  const act = el("div", "relay-act");
  act.append(...buttons);
  return act;
}

function relayKey(label, cls) {
  const b = el("button", "relay-btn" + (cls ? " " + cls : ""), label);
  b.type = "button";
  return b;
}

// A send button stays unpressable until Rust takes an approval again (`armedAtMs`, relay.rs
// `SETTLE`), so a click aimed at the sheet as it was cannot land on the one that just replaced it.
// Rust refuses such a click either way; this keeps the button from looking pressable meanwhile.
function relaySettle(button, armedAtMs) {
  const wait = armedAtMs - Date.now();
  if (wait <= 0 || button.disabled) return;
  button.disabled = true;
  setTimeout(() => { button.disabled = false; }, wait);
}

// A redraw the page makes itself (a row picked, the list opened) moves 送出 as a view from Rust
// does, and Rust does not hear of it, so the page holds the button for as long as Rust would
// (relay.rs `SETTLE`). `relayCount` is what enables it again, by the one rule it keeps.
const RELAY_SETTLE_MS = 800;
function relayHold(d, untilMs) {
  clearTimeout(d.settle);
  d.armedAt = untilMs;
  d.settle = setTimeout(() => {
    d.armedAt = 0;
    relayCount(relayView);
  }, Math.max(0, untilMs - Date.now()));
}

// The field grows with its text, up to most of the band, so the words that leave are in view.
function relayFit(field) {
  field.style.height = "auto";
  field.style.height = Math.min(field.scrollHeight + 2, 168) + "px";
}

// `local` is a redraw the page made itself, for a row picked or the list opened: the field and what
// was typed in it stay. Any other is a view from Rust, whose text is the field's.
function drawDraft(v, local) {
  const rows = v.pick.kind === "rows" ? v.pick.choices : [];
  const pickable = (id) => rows.some((c) => c.sessionId === id && !c.unpickable);
  if (!relayDraft || relayDraft.draft !== v.draft) {
    const field = el("textarea", "relay-field");
    field.rows = 3;
    field.spellcheck = false;
    field.setAttribute("aria-label", "要轉的話");
    field.addEventListener("input", () => {
      relayCount(relayView);
      relayFit(field);
    });
    relayDraft = { draft: v.draft, picked: null, choosing: false, field, count: el("div", "relay-meta"), refused: el("div", "relay-error"), row: null, send: null, armedAt: 0, settle: null };
  }
  const d = relayDraft;
  if (!local) {
    d.field.value = v.text;
    d.picked = v.pick.chosen || (pickable(d.picked) ? d.picked : null);
    d.choosing = d.picked === null;
  }
  const picked = rows.find((c) => c.sessionId === d.picked && !c.unpickable) || null;
  d.row = picked;

  const to = el("div", "relay-to");
  to.append(el("span", "relay-head", "轉話給"), el("span", "relay-title", picked ? picked.title : "（還沒選）"));
  if (picked && rows.length > 1) {
    const other = el("button", "relay-link", d.choosing ? "收起" : "換一個");
    other.type = "button";
    other.addEventListener("click", () => {
      d.choosing = !d.choosing;
      drawRelay(relayView, true);
    });
    to.append(other);
  }
  const nodes = [to];
  if (picked) nodes.push(el("div", "relay-where", relayWhere(picked)));
  if (v.pick.kind === "failed") {
    nodes.push(el("div", "relay-error", "看不到 session 清單：" + v.pick.why));
  } else if (rows.length === 0) {
    nodes.push(el("div", "relay-note", "現在沒有看到任何 session。"));
  } else if (d.choosing) {
    if (!picked) nodes.push(el("div", "relay-label", v.hint ? "你說的是「" + v.hint + "」，選一個：" : "選一個 session："));
    const list = el("div", "relay-list");
    for (const c of rows) {
      const b = el("button", "relay-choice");
      b.type = "button";
      b.disabled = Boolean(c.unpickable);
      b.title = c.cwd;
      b.setAttribute("aria-pressed", String(c.sessionId === d.picked));
      b.append(el("span", "nm", c.title || "（沒有名字）" + c.cwd.split("\\").pop()));
      b.append(el("span", "why", c.unpickable ? RELAY_WHY_NOT[c.unpickable] || c.unpickable : c.matched ? "你說的" : c.status));
      b.addEventListener("click", () => {
        d.picked = c.sessionId;
        d.choosing = false;
        drawRelay(relayView, true);
      });
      list.append(b);
    }
    nodes.push(list);
  }
  // The field comes before the fixed words, so what 送出 sends is in view without scrolling at
  // every figure size: the band is 148 px at --figure 1.3, and the buttons are always in it.
  nodes.push(d.field, d.count);
  nodes.push(el("div", "relay-label", "送過去時前面會加這段（標題「" + v.summary + "」）："));
  nodes.push(el("div", "relay-quote", v.header));
  nodes.push(el("div", "relay-note", "送到的是對方的收件匣，它可能不讀，也可能不照做。"));
  nodes.push(d.refused);
  const cancel = relayKey("取消");
  cancel.addEventListener("click", () => relayDismiss(v.revision));
  const send = relayKey("送出", "send");
  d.send = send;
  relayHold(d, local ? Math.max(v.armedAtMs, Date.now() + RELAY_SETTLE_MS) : v.armedAtMs);
  // `detail` is 0 for a click that a key or a script made, so Enter or Space on a focused 送出 does
  // not send: only the pointer does.
  send.addEventListener("click", (e) => { if (e.detail > 0) relayApprove(v.revision, d.picked, d.field.value, d.refused); });
  nodes.push(relayButtons(cancel, send));
  relayEl.replaceChildren(...nodes);
  relayCount(v);
  relayFit(d.field);
}

// The count under the field, and whether 送出 can be pressed: someone is picked, the text is one
// Rust would take, and the sheet has stood still since it last moved.
function relayCount(v) {
  const d = relayDraft;
  if (!d || v.state !== "drafting") return;
  const n = [...d.field.value.trim()].length;
  const fits = n > 0 && n <= v.textMax;
  d.count.textContent = n + " / " + v.textMax + " 字 · 三分鐘沒按送出就收起來，不會送";
  d.count.classList.toggle("over", !fits);
  if (d.send) d.send.disabled = !d.row || !fits || Date.now() < d.armedAt;
}

function drawSending(v) {
  const to = el("div", "relay-to");
  to.append(el("span", "relay-head", "送出中"), el("span", "relay-title", v.target.title));
  const at = v.step.step === "handing" ? 2 : v.step.step === "listing" ? 1 : 0;
  const find = el("div", "relay-step" + (at === 1 ? " on" : at > 1 ? " done" : ""), "正在找「" + v.target.title + "」");
  const hand = el("div", "relay-step" + (at === 2 ? " on" : ""), at === 2 ? "交給 " + v.step.to : "交給那個 session");
  const clock = el("div", "relay-meta");
  const tick = () => {
    clock.textContent = "已經 " + Math.max(0, Math.round((Date.now() - v.sinceMs) / 1000)) + " 秒。送出中不能取消，也不能改。";
  };
  tick();
  relayTick = setInterval(tick, 1000);
  relayEl.replaceChildren(to, el("div", "relay-where", relayWhere(v.target)), find, hand, clock, el("div", "relay-label", "要轉的話："), el("div", "relay-sent", v.text));
}

function drawDone(v) {
  const o = v.outcome;
  const tone = o.kind === "delivered" ? "delivered" : o.kind === "unknown" ? "unknown" : "bad";
  const to = el("div", "relay-to");
  to.append(el("span", "relay-done " + tone, v.headline), el("span", "relay-title", v.target.title));
  const nodes = [to, el("div", "relay-reason", v.reason)];
  if (o.kind === "delivered") {
    nodes.push(el("div", "relay-meta", "訊息編號 " + o.msg_id + (v.gated === false ? " · 核准的關卡這次沒有記到，但訊息送到了" : "")));
  }
  if (typeof o.detail === "string" && o.detail) nodes.push(el("div", "relay-meta", o.detail));
  if (o.kind === "sent_other") nodes.push(el("div", "relay-label", "實際送給「" + o.to + "」的是："), el("div", "relay-sent", o.message));
  nodes.push(el("div", "relay-label", o.kind === "sent_other" ? "你核准的是：" : "要轉的話："), el("div", "relay-sent", v.text));
  const refused = el("div", "relay-error");
  nodes.push(refused);
  const close = relayKey("關閉");
  close.addEventListener("click", () => relayDismiss(v.revision));
  const keys = [close];
  if (v.retry) {
    const again = relayKey("再送一次", "send");
    relaySettle(again, v.armedAtMs);
    again.addEventListener("click", (e) => { if (e.detail > 0) relayApprove(v.revision, v.target.sessionId, v.text, refused); });
    keys.push(again);
  }
  nodes.push(relayButtons(...keys));
  relayEl.replaceChildren(...nodes);
}

// The one place the page asks Rust to send, called only from the two click handlers above. Rust checks
// the revision, the row and the text again, and a refusal is said on the sheet.
function relayApprove(revision, sessionId, text, refusedEl) {
  refusedEl.textContent = "";
  invoke("relay_approve", { revision, sessionId, text }).catch((e) => {
    refusedEl.textContent = String(e);
  });
}

function relayDismiss(revision) {
  invoke("relay_dismiss", { revision }).catch((e) => console.error("relay_dismiss: " + String(e)));
}

// Escape is 取消, or 關閉 on an outcome. No key sends: Enter in the field is a new line, which is the
// field's own behaviour, and the send buttons ignore a click a key made.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.isComposing) return;
  if (relayView.state === "drafting" || relayView.state === "done") relayDismiss(relayView.revision);
});

// After the character, wrapped, and with the listener before the question, for the reasons the core's
// wiring gives. A relay that cannot be wired leaves everything else working. The answer to the
// question is used only when no event has come since it was asked, because an event is newer.
let relayHeard = false;
try {
  window.__TAURI__.event
    .listen("relay-state", (e) => {
      relayHeard = true;
      onRelayState(e.payload);
    })
    .then(() => invoke("relay_state"))
    .then((v) => {
      if (!relayHeard) onRelayState(v);
    })
    .catch((e) => console.error("relay wiring: " + String(e)));
} catch (e) {
  console.error("relay wiring: " + String(e));
}
</script>
</body>
