[package]
name = "vrpet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vrcue = { path = "../crates/vrcue" }
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }

[build-dependencies]
tauri-build = "2"
